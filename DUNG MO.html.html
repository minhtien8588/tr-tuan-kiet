<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090b12"><title>tr tuan kiet</title><style>*{box-sizing:border-box}body{margin:0;background:#090b12;color:#fff;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif}.w{max-width:520px;margin:auto;padding:24px 16px 40px}.icon{width:92px;height:92px;margin:8px auto 12px;border-radius:24px;background:radial-gradient(circle at 50% 70%,#ffdf55 0 13%,#ff8b17 30%,#f22 58%,#301 100%);display:grid;place-items:center;font-size:46px;box-shadow:0 0 35px #f40}.t{text-align:center;font-size:30px;font-weight:900}.s{text-align:center;color:#95a0b5;margin:4px 0 24px}.c{background:#131824;border:1px solid #273044;border-radius:18px;padding:16px;margin:12px 0}label{display:block;color:#adb6c7;font-size:12px;margin-bottom:7px}select,input,button{width:100%;border-radius:12px;border:1px solid #313a50;background:#0b0f18;color:#fff;padding:13px;font-size:15px}button{background:#19d978;color:#06130b;border:0;font-weight:900;margin-top:10px}.b{background:#252d3e;color:#fff}.x{display:grid;grid-template-columns:1fr 1fr;gap:10px}.r{display:flex;gap:10px;align-items:center;margin:12px 0}.r span{width:85px;font-size:13px}.r b{width:34px;text-align:right;color:#67e7a4}.note{font-size:11px;color:#7e899d;text-align:center;line-height:1.5;margin-top:14px}</style></head><body><div class="w"><div class="icon">🔥</div><div class="t">tr tuan kiet</div><div class="s">FF OB55 • iPhone Sensitivity</div><div class="c"><label>CHỌN DÒNG IPHONE</label><select id="d"><option value="0">iPhone 6s</option><option value="1">iPhone 7</option><option value="2">iPhone 8</option><option value="3">iPhone X</option><option value="4">iPhone XR</option><option value="5">iPhone XS</option><option value="6">iPhone 11</option><option value="7">iPhone 12 mini</option><option value="8">iPhone 12</option><option value="9">iPhone 13 mini</option><option value="10">iPhone 13</option><option value="11">iPhone 14</option><option value="12">iPhone 15</option><option value="13">iPhone 15 Pro</option><option value="14">iPhone 15 Pro Max</option><option value="15">iPhone 16</option><option value="16">iPhone 16 Pro</option><option value="17">iPhone 16 Pro Max</option><option value="18">iPhone 17</option><option value="19">iPhone 17 Pro</option><option value="20">iPhone 17 Pro Max</option><option value="21">iPhone 18</option><option value="22">iPhone 18 Pro</option><option value="23">iPhone 18 Pro Max</option></select></div><div class="c"><label>TÌNH TRẠNG</label><div class="x"><button onclick="apply('Lố đầu')">LỐ ĐẦU</button><button onclick="apply('Lạc tâm')">LẠC TÂM</button></div><button class="b" onclick="apply('Nặng tâm')">NẶNG TÂM</button></div><div class="c"><label>ĐỘ NHẠY GỢI Ý</label><div id="c"><div class="r"><span>General</span><input type="range" min="0" max="200" value="162" oninput="this.nextElementSibling.textContent=this.value"><b>162</b></div><div class="r"><span>Red Dot</span><input type="range" min="0" max="200" value="155" oninput="this.nextElementSibling.textContent=this.value"><b>155</b></div><div class="r"><span>2x Scope</span><input type="range" min="0" max="200" value="154" oninput="this.nextElementSibling.textContent=this.value"><b>154</b></div><div class="r"><span>4x Scope</span><input type="range" min="0" max="200" value="145" oninput="this.nextElementSibling.textContent=this.value"><b>145</b></div><div class="r"><span>Sniper Scope</span><input type="range" min="0" max="200" value="79" oninput="this.nextElementSibling.textContent=this.value"><b>79</b></div><div class="r"><span>Free Look</span><input type="range" min="0" max="200" value="158" oninput="this.nextElementSibling.textContent=this.value"><b>158</b></div></div></div><div class="c"><button onclick="save()">LƯU CẤU HÌNH</button><button class="b" onclick="download()">TẢI FILE APP</button></div><div class="note">Công cụ chỉ tạo thông số để nhập thủ công trong game; không can thiệp vào dữ liệu Free Fire.</div></div><script>const ds=['iPhone 6s','iPhone 7','iPhone 8','iPhone X','iPhone XR','iPhone XS','iPhone 11','iPhone 12 mini','iPhone 12','iPhone 13 mini','iPhone 13','iPhone 14','iPhone 15','iPhone 15 Pro','iPhone 15 Pro Max','iPhone 16','iPhone 16 Pro','iPhone 16 Pro Max','iPhone 17','iPhone 17 Pro','iPhone 17 Pro Max','iPhone 18','iPhone 18 Pro','iPhone 18 Pro Max'];const d=document.getElementById('d');ds.forEach((x,i)=>d.add(new Option(x,i)));d.value=13;function calc(){let i=+d.value,f=.88+i*.006,out={General:190,'Red Dot':185,'2x Scope':175,'4x Scope':165,'Sniper Scope':90,'Free Look':180};return Object.fromEntries(Object.entries(out).map(([k,v])=>[k,Math.min(200,Math.round(v*f))]))}function show(v){document.getElementById('c').innerHTML=Object.entries(v).map(([k,n])=>`<div class="r"><span>${k}</span><input type="range" min="0" max="200" value="${n}" oninput="this.nextElementSibling.textContent=this.value"><b>${n}</b></div>`).join('')}function apply(type){let v=calc();if(type==='Lố đầu')Object.keys(v).forEach(k=>v[k]=Math.min(200,v[k]+5));if(type==='Lạc tâm'){v['Red Dot']=Math.max(0,v['Red Dot']-8);v.General=Math.max(0,v.General-5)}if(type==='Nặng tâm')Object.keys(v).forEach(k=>v[k]=Math.max(0,v[k]-10));show(v)}function save(){localStorage.setItem('ttk_saved',JSON.stringify({device:d.value,html:document.documentElement.outerHTML}));alert('Đã lưu trên máy.')}function download(){const blob=new Blob([document.documentElement.outerHTML],{type:'text/html'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='tr-tuan-kiet.html';a.click()}d.onchange=()=>show(calc());show(calc());</script></body></html>
